sonar.projectKey=taskmanager
sonar.projectName=TaskManager
sonar.projectVersion=1.0

# Source code location
sonar.sources=app
sonar.tests=tests

# Language
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/node_modules/**
sonar.test.exclusions=**/__pycache__/**

# Coverage exclusions
sonar.coverage.exclusions=**/__pycache__/**,**/*.pyc,**/test_*.py,**/tests/**

# Host URL (will be set by Jenkins)
# sonar.host.url=http://sonarqube:9000
