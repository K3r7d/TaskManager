services:
  # Backend API Service
  - type: web
    name: taskmanager-backend
    env: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHONPATH
        value: /code
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    buildFilter:
      paths:
        - app/**
        - docker/**
        - requirements.txt
        - runtime.txt
    healthCheckPath: /health

databases:
  # PostgreSQL Database  
  - name: taskmanager-db
    databaseName: taskmanager
    user: taskmanager_user
    plan: free